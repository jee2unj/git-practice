name: Conditional Example
on: workflow_dispatch
jobs:
  conditional:
    runs-on: ubuntu-latest
    steps:
      - name: Show Run ID
        run: echo "Run ID = ${{ github.run_id }}"
      
      # if 먼저 작성
      - name: Print Hello
        if: ${{ contains(github.run_id, '2') }}
        run: echo "Hello"     # 조건 불만족시 무시됨

      # run 먼저
      - name: Print Goodbye
        run: echo "Goodbye"
        if: ${{ !contains(github.run_id, '1') }}
