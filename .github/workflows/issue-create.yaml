# (hm) push할 때마다 issue 자동 생성되도록
name: Create Issue on every push
on: push
permissions:
  issues: write
jobs:
  create:
    runs-on: ubuntu-latest
    
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      PUSHER: ${{ github.event.pusher.name }}

    steps:
      # 1. GitHub CLI 사용
      - name: Create with GitHub CLI
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues" \
            -f title="[Push] $PUSHER pushes new commit" \
            -f body=$"written with GitHub CLI
            Commit message: $COMMIT_MESSAGE" \
            --jq '.html_url'

      # 2. curl 사용
      - name: Create with curl
        run: |
          curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" \
            -d "{\"title\":\"[Push] $PUSHER pushes new commit\", \"body\":\"written with curl\\nCommit message: $COMMIT_MESSAGE\"}"
