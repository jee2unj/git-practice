name: Orderlab CI
on: push
# 권한
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # 컥
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .             # 정적 검사
      - run: ruff format --check .
      - run: python -m pytest -q
